<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Measured</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f5;
      --card: #fff;
      --fg: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #18181b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Outfit, system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #e4e4e7, transparent),
        var(--bg);
      color: var(--fg);
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgb(0 0 0 / 0.06);
    }
    img { height: 28px; margin-bottom: 20px; }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .primary {
      background: var(--accent);
      color: #fff;
    }
    .secondary {
      background: #f4f4f5;
      color: var(--fg);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/img/logolarge.png" alt="Measured">
    <h1>Page not found</h1>
    <p>That URL doesn’t match a page in Measured Stock. Head back to the app you meant to open.</p>
    <div class="actions">
      <a class="primary" href="/app">Staff app</a>
      <a class="secondary" href="/">Admin</a>
      <a class="secondary" href="/login">Sign in</a>
    </div>
  </div>
</body>
</html>
