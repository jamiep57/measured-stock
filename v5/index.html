<!DOCTYPE html>
<!--
  Measured — staff mobile PWA
  Home · Counts · Kit · Deliveries
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>Measured</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/v5/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="/v5/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/v5/kit-count-icon-192.png">
  <link rel="icon" type="image/png" href="/v5/kit-count-icon.png">
  <link rel="manifest" href="/v5/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Measured">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-side topbar-side--left">
          <button class="topbar-avatar" id="reloadBtn" type="button" aria-label="Sync">
            <img src="/v5/kit-count-icon-192.png" alt="" class="topbar-avatar-img">
            <span class="topbar-dot" id="syncBadge" hidden aria-hidden="true"></span>
          </button>
          <button class="topbar-avatar topbar-avatar--back" id="cntBackTop" type="button" hidden aria-label="Back to sessions">
            <i class="ph ph-arrow-left"></i>
          </button>
        </div>

        <div class="topbar-center" id="eventSelectWrap">
          <div class="topbar-event" id="eventPickerFace">
            <span class="topbar-event-label" id="eventPickerLabel">Select event</span>
            <i class="ph ph-caret-down topbar-event-caret" aria-hidden="true"></i>
          </div>
          <select id="eventPick" class="topbar-event-native" aria-label="Select event"></select>
        </div>

        <div class="topbar-side topbar-side--right" aria-hidden="true"></div>
      </div>
    </header>

    <main class="main" id="main">
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-counts"></section>
      <section class="view" id="view-kit"></section>
      <section class="view" id="view-deliveries"></section>
    </main>

    <div class="count-save-bar" id="cntSaveBar" hidden>
      <button class="btn btn-primary btn-block btn-lg" type="button" id="cntSaveBtn">
        <i class="ph-bold ph-floppy-disk"></i> Save count
      </button>
    </div>

    <nav class="bottomnav" id="bottomNav">
      <button class="navbtn active" type="button" data-tab="home"><i class="ph ph-house"></i><span>Home</span></button>
      <button class="navbtn" type="button" data-tab="counts"><i class="ph ph-clipboard-text"></i><span>Counts</span></button>
      <button class="navbtn" type="button" data-tab="kit"><i class="ph ph-package"></i><span>Kit</span></button>
      <button class="navbtn" type="button" data-tab="deliveries"><i class="ph ph-shipping-container"></i><span>Deliveries</span></button>
    </nav>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <button class="icon-btn" type="button" id="sheetClose" aria-label="Close"><i class="ph ph-x"></i></button>
      <div class="sheet-title" id="sheetTitle"></div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
