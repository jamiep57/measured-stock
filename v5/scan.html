<!DOCTYPE html>
<!--
  Measured Stock V5 — Mobile kit tools.
  • /v5/scan/?s=<sessionId>  — phone companion for event Kit scan mode
  • /v5/scan                 — container counting (create/scan box → add items)
  • /v5/scan/?c=<productId>  — resume counting a container
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>Kit Count</title>
  <!-- iOS home screen uses apple-touch-icon (180); share sheet can use favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/v5/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="/v5/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/v5/kit-count-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/v5/kit-count-icon.png">
  <link rel="manifest" href="/v5/kit-count.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kit Count">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --card: #1a1d24;
      --card-2: #22262f;
      --ok: #22c55e;
      --err: #ef4444;
      --border: #2a2f3a;
      --accent: #e8c47c;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100%;
    }
    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--safe-bottom);
    }

    /* —— Companion scanner (session mode) —— */
    .scan-top {
      padding: calc(12px + var(--safe-top)) 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .scan-brand {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .scan-mode { font-size: 22px; font-weight: 700; }
    .scan-hint { font-size: 13px; color: var(--muted); line-height: 1.35; }
    .scan-stage {
      flex: 1;
      position: relative;
      margin: 0 12px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      min-height: 240px;
    }
    .scan-stage video,
    .scan-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .scan-stage canvas { opacity: 0; pointer-events: none; }
    .scan-reticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78%, 280px);
      aspect-ratio: 3 / 2;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,0.75);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
      pointer-events: none;
    }
    .scan-stage-hint {
      position: absolute;
      left: 0; right: 0; bottom: 10px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      pointer-events: none;
    }
    .scan-feedback {
      margin: 12px 16px 0;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 15px;
      font-weight: 600;
    }
    .scan-feedback.is-ok { border-color: var(--ok); color: #bbf7d0; }
    .scan-feedback.is-err { border-color: var(--err); color: #fecaca; }
    .scan-manual {
      margin: 12px 16px calc(16px + var(--safe-bottom));
      display: flex;
      gap: 8px;
    }
    .scan-manual input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      padding: 0 14px;
      font: inherit;
      font-size: 16px;
    }
    .scan-manual button {
      height: 48px;
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: var(--fg);
      color: var(--bg);
      font: inherit;
      font-weight: 600;
    }
    .scan-error {
      margin: 24px 16px;
      padding: 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--err);
      color: #fecaca;
      line-height: 1.4;
    }

    /* —— Kit count mobile —— */
    .kc-loading, .kc-fatal {
      margin: calc(48px + var(--safe-top)) 20px;
      color: var(--muted);
      line-height: 1.4;
    }
    .kc-fatal { color: #fecaca; border: 1px solid var(--err); padding: 16px; border-radius: 12px; background: var(--card); }
    .kc-top {
      padding: calc(14px + var(--safe-top)) 16px 8px;
    }
    .kc-top--row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .kc-top-grow { flex: 1; min-width: 0; }
    .kc-brand {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .kc-title {
      margin: 4px 0 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .kc-title--sm { font-size: 20px; }
    .kc-sub {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
    }
    .kc-pad { padding: 0 16px; }
    .kc-meta { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .kc-back {
      flex-shrink: 0;
      margin-top: 2px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
    }
    .kc-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px 16px 8px;
    }
    .kc-dest-btn {
      width: 100%;
      min-height: 72px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font: inherit;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .kc-dest-btn strong {
      font-size: 16px;
      font-weight: 700;
    }
    .kc-dest-btn em {
      font-style: normal;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.35;
    }
    .kc-btn {
      height: 52px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font: inherit;
      font-size: 16px;
      font-weight: 600;
    }
    .kc-btn--primary {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    .kc-btn--ghost {
      background: transparent;
      border-style: dashed;
      color: var(--muted);
      height: 44px;
      font-size: 14px;
    }
    .kc-btn--block { width: 100%; }
    .kc-btn--compact {
      height: 48px;
      padding: 0 12px;
      flex-shrink: 0;
      font-size: 14px;
    }
    .kc-btn--icon {
      width: 52px;
      padding: 0;
      flex-shrink: 0;
    }
    .kc-btn:disabled { opacity: 0.55; }
    .kc-section {
      padding: 16px 16px 8px;
    }
    .kc-section--grow { flex: 1; }
    .kc-section-title {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .kc-list { display: flex; flex-direction: column; gap: 8px; }
    .kc-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font: inherit;
    }
    .kc-row-name { font-weight: 600; font-size: 15px; }
    .kc-row-meta { font-size: 12px; color: var(--muted); }
    .kc-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 12px 16px 24px;
    }
    .kc-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .kc-field em { font-style: normal; font-weight: 500; opacity: 0.7; }
    .kc-field input,
    .kc-field select {
      height: 48px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      padding: 0 14px;
      font: inherit;
      font-size: 16px;
      font-weight: 500;
    }
    .kc-field-row { display: flex; gap: 8px; }
    .kc-field-row select { flex: 1; min-width: 0; }
    .kc-field-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 10px;
    }
    .kc-err {
      margin: 0;
      color: #fecaca;
      font-size: 13px;
      font-weight: 500;
    }
    .kc-stage {
      position: relative;
      margin: 8px 12px 0;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      min-height: 260px;
      flex: 1;
    }
    .kc-stage video,
    .kc-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .kc-stage canvas { opacity: 0; pointer-events: none; }
    .kc-reticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78%, 280px);
      aspect-ratio: 3 / 2;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,0.75);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
      pointer-events: none;
    }
    .kc-feedback {
      margin: 10px 16px 0;
      min-height: 40px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }
    .kc-add-panel .kc-feedback {
      margin: 8px 0 0;
      width: 100%;
    }
    .kc-feedback.is-ok { border-color: var(--ok); color: #bbf7d0; }
    .kc-feedback.is-err { border-color: var(--err); color: #fecaca; }
    .kc-nested-btn {
      margin-top: 8px;
      width: 100%;
      min-height: 52px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--fg);
      font: inherit;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .kc-nested-btn strong {
      font-size: 14px;
      font-weight: 600;
    }
    .kc-nested-btn em {
      font-style: normal;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.35;
    }
    .kc-manual {
      margin: 10px 16px 16px;
      display: flex;
      gap: 8px;
    }
    .kc-manual input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      padding: 0 14px;
      font: inherit;
      font-size: 16px;
    }
    .kc-manual button {
      height: 48px;
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: var(--fg);
      color: var(--bg);
      font: inherit;
      font-weight: 600;
    }
    .kc-add-panel {
      padding: 8px 16px 0;
    }
    .kc-search-row {
      display: flex;
      gap: 8px;
    }
    .kc-search {
      flex: 1;
      min-width: 0;
      height: 52px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      padding: 0 16px;
      font: inherit;
      font-size: 16px;
    }
    .kc-search--block {
      width: 100%;
      flex: none;
      display: block;
      box-sizing: border-box;
    }
    .kc-suggest {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kc-suggest-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--fg);
      font: inherit;
    }
    .kc-suggest-row strong { display: block; font-size: 15px; font-weight: 600; }
    .kc-suggest-row em { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .kc-suggest-plus {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }
    .kc-empty {
      margin: 0;
      padding: 8px 2px;
      font-size: 13px;
      color: var(--muted);
    }
    .kc-content-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 6px;
      align-items: center;
      padding: 12px 8px 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .kc-label-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--fg);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .kc-label-btn.is-queued {
      border-color: #3d5a40;
      color: #bbf7d0;
      background: #162018;
    }
    .kc-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--fg);
      line-height: 1.35;
    }
    .kc-check input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .kc-check em {
      display: block;
      font-style: normal;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 2px;
    }
    .kc-complete-bar {
      position: sticky;
      bottom: 0;
      margin-top: auto;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: linear-gradient(to top, var(--bg) 70%, transparent);
    }
    .kc-section--grow {
      padding-bottom: 8px;
    }
    .kc-content-main {
      min-width: 0;
      display: block;
      text-align: left;
      padding: 0;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    .kc-content-main:disabled { pointer-events: none; }
    .kc-content-main:not(:disabled) { cursor: pointer; }
    .kc-content-main:not(:disabled) strong { color: var(--accent); }
    .kc-content-row.is-container {
      border-color: #3a3428;
      background: #1c1a16;
    }
    .kc-content-main strong {
      display: block;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kc-content-main em {
      display: block;
      font-style: normal;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .kc-stepper {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .kc-step {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--fg);
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }
    .kc-qty {
      width: 44px;
      height: 36px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 0;
    }
    .kc-remove {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }
    .kc-sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 12px calc(16px + var(--safe-bottom));
    }
    .kc-sheet-card {
      width: min(480px, 100%);
      max-height: min(90vh, 640px);
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .kc-sheet-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .kc-sheet-hint {
      margin: -4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .kc-sheet-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .kc-sheet-actions .kc-btn { height: 48px; min-width: 96px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/scan-app.js"></script>
</body>
</html>
