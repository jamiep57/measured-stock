<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Measured Stock — Create your account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, #e8e8ec 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 100%, #d4d4d8 0%, transparent 50%),
        #fafafa;
      color: #18181b;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 22rem;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 4px;
      padding: 2rem;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    }
    h1 { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.25rem; }
    .sub { font-size: 0.875rem; color: #71717a; margin-bottom: 1.5rem; line-height: 1.5; }
    .sub.error { color: #dc2626; }
    .sub.ok { color: #15803d; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
    .field { margin-bottom: 1rem; }
    input {
      width: 100%;
      font: inherit;
      padding: 0.75rem 1rem;
      border: 1px solid #e4e4e7;
      border-radius: 4px;
      outline: none;
    }
    input:focus { border-color: #18181b; box-shadow: 0 0 0 2px rgb(24 24 27 / 0.1); }
    input:disabled { background: #f4f4f5; color: #71717a; }
    button {
      width: 100%;
      font: inherit;
      font-weight: 500;
      padding: 0.625rem 1rem;
      background: #18181b;
      color: #fafafa;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #27272a; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    a { color: #18181b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <p class="sub" id="msg">Checking your invite…</p>

    <div id="invalidView" hidden>
      <p class="sub">This invite link is invalid or expired.</p>
      <p class="sub" style="margin-bottom:0;">Ask an admin for a new link, or <a href="/login">sign in</a> if you already have an account.</p>
    </div>

    <form id="onboardForm" hidden autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" disabled autocomplete="username" />
      </div>
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" maxlength="40" required autocomplete="nickname" placeholder="e.g. Charlie" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="password2">Confirm password</label>
        <input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" id="submitBtn">Finish setup</button>
    </form>
  </div>

  <script type="module" src="/assets/js/onboard.js"></script>
</body>
</html>
