<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f4f5" />
  <title>Measured Stock — First admin setup</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f4f5;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --card: #ffffff;
      --primary: #18181b;
      --primary-fg: #fafafa;
      --danger: #dc2626;
      --success: #15803d;
      --radius: 12px;
      --shadow:
        0 1px 2px rgb(0 0 0 / 0.04),
        0 12px 32px rgb(0 0 0 / 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Outfit, system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--fg);
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 70% at 12% -10%, #e4e4e7 0%, transparent 55%),
        radial-gradient(ellipse 70% 55% at 100% 110%, #d4d4d8 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 70% 20%, rgb(24 24 27 / 0.04) 0%, transparent 60%),
        var(--bg);
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      background-image:
        linear-gradient(rgb(24 24 27 / 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgb(24 24 27 / 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 20%, transparent 75%);
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 24rem;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1.75rem;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.75rem;
      animation: rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }

    .brand-wordmark {
      width: min(100%, 13rem);
      height: auto;
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem 1.5rem;
      box-shadow: var(--shadow);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }

    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 0.35rem;
    }

    .sub {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.35rem;
      line-height: 1.5;
    }
    .sub.error { color: var(--danger); }
    .sub.ok { color: var(--success); }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: #3f3f46;
    }

    .field { margin-bottom: 1rem; }

    input {
      width: 100%;
      font: inherit;
      font-size: 0.9375rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    input:hover { border-color: #d4d4d8; }
    input:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(24 24 27 / 0.1);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      font: inherit;
      font-weight: 550;
      font-size: 0.9375rem;
      padding: 0.7rem 1rem;
      background: var(--primary);
      color: var(--primary-fg);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    button:hover { background: #27272a; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .note {
      margin-top: 1.15rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }

    a {
      color: var(--fg);
      font-weight: 500;
      text-underline-offset: 2px;
    }
    a:hover { text-decoration-thickness: 2px; }

    .corner {
      position: fixed;
      width: 2.25rem;
      height: 2.25rem;
      border-color: rgb(24 24 27 / 0.12);
      border-style: solid;
      pointer-events: none;
      z-index: 0;
      animation: fadeIn 1s ease 0.2s both;
    }
    .corner-tl {
      top: 1.25rem;
      left: 1.25rem;
      border-width: 1.5px 0 0 1.5px;
    }
    .corner-br {
      bottom: 1.25rem;
      right: 1.25rem;
      border-width: 0 1.5px 1.5px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 420px) {
      body { padding: 1.25rem 1rem; }
      .card { padding: 1.5rem 1.15rem; }
      .brand-wordmark { width: min(100%, 10rem); }
      .corner { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .shell, .brand, .card, .corner { animation: none; }
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="corner corner-tl" aria-hidden="true"></div>
  <div class="corner corner-br" aria-hidden="true"></div>

  <div class="shell">
    <header class="brand">
      <img class="brand-wordmark" src="/assets/img/logolarge.png" alt="Measured" />
    </header>

    <div class="card">
      <h1>Create first admin</h1>
      <p class="sub" id="msg">Checking whether setup is available…</p>

      <div id="closedView" hidden>
        <p class="sub">An admin already exists. Go to sign in instead.</p>
        <a href="/login"><button type="button">Go to sign in</button></a>
      </div>

      <form id="setupForm" hidden autocomplete="on">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" maxlength="40" required autocomplete="nickname" placeholder="e.g. Charlie" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" id="submitBtn">Create admin account</button>
        <p class="note">
          This page only works when there are no active admins yet.
          After setup, use <a href="/login">/login</a> next time.
        </p>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/js/setup.js"></script>
</body>
</html>
