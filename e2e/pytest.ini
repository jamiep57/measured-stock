[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video off
markers =
    slow: longer multi-step UI flows
filterwarnings =
    ignore::DeprecationWarning
# Tip: if Playwright's bundled Chromium is not installed yet, run with
#   pytest --browser-channel chrome
# to use the system Google Chrome app instead.
